resources:
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: local_service_8080
    type: STATIC
    connect_timeout: 5s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: local_service_8080
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080
